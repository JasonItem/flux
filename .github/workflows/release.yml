name: Release

on:
  workflow_dispatch:
    inputs:
      macos:
        description: Build macOS DMG
        type: boolean
        default: true
      windows:
        description: Build Windows NSIS installer
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS DMG
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG (Intel x64 + Apple Silicon arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: flux-macos
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error

  windows:
    name: Windows NSIS (x64)
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows x64 installer
        run: npm run dist:win

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: flux-windows
          path: |
            release/*Setup*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [macos, windows]
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      (needs.macos.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.dmg' -o -name '*Setup*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' -o -name '*.zip' \) -print -exec cp {} upload/ \;
          ls -lah upload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: false
